name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: version-${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set the version, and date the changelog
        run: node scripts/release.mjs prepare "$VERSION"
      - name: Stop if the branch exists
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH exists. Close its pull request, delete the branch, then run this again."
            exit 1
          fi
      - name: Commit and push
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Release $VERSION"
          git push origin "$BRANCH"
      - name: Open the pull request
        run: |
          {
            echo "Merging this pull request releases $VERSION: the release workflow tags it, deploys the live site, and publishes the GitHub release."
            echo
            node scripts/release.mjs notes "$VERSION"
          } > body.md
          gh pr create --base main --head "$BRANCH" --title "Release $VERSION" --body-file body.md
      - name: Run the gate on it
        run: gh workflow run gate.yml --ref "$BRANCH"
